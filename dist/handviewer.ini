; chunithm-handviewer 配置文件
; 改动后重启 exe 生效

[general]
port=38085
open_browser=1
theme=flat

[input]
; 原生 HID（CFW 固件）兜底；官方固件和游戏进程两条路会自动识别
hid=1
; VID/PID 对不上时用报文魔数探测
probe=0
vid=0x1CCF
pid=0x2333
; 网页里的默认阈值（也会存在浏览器里）
threshold=20
; 键盘输入：与台子数据取"较高者"合并显示
keyboard=1

[keys]
; cells: 左 -> 右 32 个格子，默认 segatools 布局
; 记号：字母 / 数字 / SPACE / ENTER / TAB / ESC / LEFT / F1 ...
; 网页设置里点格子再按键也能改（会写回本文件）
cells=S S S S D D D D F F F F G G G G H H H H J J J J K K K K L L L L
air_keys=
fn_keys=
